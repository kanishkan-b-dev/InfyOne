<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfyOne — Enterprise Portal Sign In</title>
    <meta name="description" content="Secure authentication portal for InfyOne Infosys AI Assistant.">
    <meta name="theme-color" content="#0a0a0a">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2216%22 fill=%22%237170ff%22/><text y=%22.85em%22 x=%2250%22 font-size=%2264%22 text-anchor=%22middle%22 fill=%22white%22>I</text></svg>">

    <style>
        :root {
            --bg-base: #070709;
            --bg-card: rgba(18, 18, 24, 0.82);
            --bg-input: #121319;
            --border-card: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(113, 112, 255, 0.4);
            --border-focus: #7170ff;
            --text-primary: #f7f8f8;
            --text-secondary: #9da1b0;
            --text-muted: #65697b;
            --accent: #7170ff;
            --accent-glow: rgba(113, 112, 255, 0.28);
            --accent-hover: #8281ff;
            --error-bg: rgba(255, 75, 75, 0.12);
            --error-border: rgba(255, 75, 75, 0.35);
            --error-text: #ff6b6b;
            --success-bg: rgba(46, 213, 115, 0.12);
            --success-border: rgba(46, 213, 115, 0.35);
            --success-text: #2ed573;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glow Backdrop */
        .ambient-glow {
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 600px;
            background: radial-gradient(circle, rgba(113, 112, 255, 0.14) 0%, rgba(94, 106, 210, 0.04) 50%, transparent 75%);
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        .ambient-grid {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        /* Container */
        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 40px 36px;
            backdrop-filter: blur(24px);
            box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.7),
                        0 0 0 1px rgba(255, 255, 255, 0.05);
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Header */
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            text-decoration: none;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #7170ff, #5046e5);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            box-shadow: 0 8px 24px rgba(113, 112, 255, 0.35);
        }

        .brand-name {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        .brand-subtitle {
            font-size: 13.5px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-top: 6px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-card);
            border-radius: 10px;
            padding: 13px 14px 13px 40px;
            font-family: 'Inter', sans-serif;
            font-size: 14.5px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input::placeholder {
            color: #4b4e63;
        }

        .form-input:hover {
            border-color: var(--border-hover);
        }

        .form-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: #15161f;
        }

        .input-icon {
            position: absolute;
            left: 13px;
            color: var(--text-muted);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            border-radius: 6px;
            transition: color 0.15s;
        }

        .password-toggle:hover {
            color: var(--text-primary);
        }

        /* Alert / Message */
        .alert-box {
            display: none;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.45;
            margin-bottom: 20px;
        }

        .alert-error {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
        }

        .alert-success {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success-text);
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #7170ff, #5748e6);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 14px 20px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14.5px;
            font-weight: 700;
            letter-spacing: -0.01em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 20px rgba(113, 112, 255, 0.35);
            margin-top: 26px;
        }

        .submit-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #8180ff, #6353f0);
            box-shadow: 0 10px 28px rgba(113, 112, 255, 0.45);
            transform: translateY(-1px);
        }

        .submit-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer Security Badge */
        .login-footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            color: var(--text-muted);
            letter-spacing: 0.01em;
        }

        .security-badge svg {
            color: #2ed573;
        }

        /* Shake animation for error */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>

<body>
    <div class="ambient-glow" aria-hidden="true"></div>
    <div class="ambient-grid" aria-hidden="true"></div>

    <div class="login-card" id="loginCard">
        <header class="login-header">
            <a href="/" class="brand-logo" aria-label="InfyOne Home">
                <div class="brand-icon">I</div>
                <span class="brand-name">InfyOne</span>
            </a>
            <p class="brand-subtitle">Enterprise AI Knowledge Engine<br>Sign in to access your authorized workspace.</p>
        </header>

        <div id="alertBox" class="alert-box alert-error" role="alert">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="alertMessage">Invalid credentials. Please verify and try again.</span>
        </div>

        <form id="loginForm" autocomplete="on">
            <div class="form-group">
                <label for="usernameInput" class="form-label">Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input type="text" id="usernameInput" class="form-input" placeholder="e.g. admin" required autofocus autocomplete="username" spellcheck="false">
                </div>
            </div>

            <div class="form-group">
                <label for="passwordInput" class="form-label">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" id="passwordInput" class="form-input" placeholder="••••••••••••" required autocomplete="current-password">
                    <button type="button" id="togglePasswordBtn" class="password-toggle" aria-label="Toggle password visibility">
                        <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                <span id="btnText">Sign In to InfyOne</span>
                <span id="btnSpinner" class="spinner"></span>
            </button>
        </form>

        <footer class="login-footer">
            <div class="security-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                <span>Key Vault Verified • 256-bit Session Security</span>
            </div>
        </footer>
    </div>

    <script>
        (function() {
            const form = document.getElementById('loginForm');
            const card = document.getElementById('loginCard');
            const usernameInput = document.getElementById('usernameInput');
            const passwordInput = document.getElementById('passwordInput');
            const togglePasswordBtn = document.getElementById('togglePasswordBtn');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const alertBox = document.getElementById('alertBox');
            const alertMessage = document.getElementById('alertMessage');

            // Password visibility toggle
            togglePasswordBtn.addEventListener('click', function() {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                this.innerHTML = isPassword ?
                    `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>` :
                    `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>`;
            });

            function showAlert(msg, isError = true) {
                alertBox.className = 'alert-box ' + (isError ? 'alert-error' : 'alert-success');
                alertMessage.textContent = msg;
                alertBox.style.display = 'flex';
                if (isError) {
                    card.classList.remove('shake');
                    void card.offsetWidth; // Trigger reflow
                    card.classList.add('shake');
                }
            }

            function hideAlert() {
                alertBox.style.display = 'none';
            }

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideAlert();

                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username || !password) {
                    showAlert('Please enter both username and password.');
                    return;
                }

                // Loading UI state
                submitBtn.disabled = true;
                btnText.textContent = 'Verifying credentials...';
                btnSpinner.style.display = 'inline-block';

                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ username, password }),
                    });

                    const data = await response.json();

                    if (response.ok && data.status === 'success') {
                        showAlert('Sign-in successful. Welcome, ' + data.username + '!', false);
                        submitBtn.disabled = true;
                        btnText.textContent = 'Redirecting...';
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 500);
                    } else {
                        const errMsg = data.detail || 'Sign in failed. Please verify your credentials.';
                        showAlert(errMsg, true);
                        passwordInput.value = '';
                        passwordInput.focus();
                    }
                } catch (err) {
                    showAlert('Network error communicating with authentication service. Please try again.');
                } finally {
                    if (btnText.textContent !== 'Redirecting...') {
                        submitBtn.disabled = false;
                        btnText.textContent = 'Sign In to InfyOne';
                        btnSpinner.style.display = 'none';
                    }
                }
            });
        })();
    </script>
</body>

</html>
